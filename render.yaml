# Render Blueprint: one web service (FastAPI serves the API and the built React UI).
services:
  - type: web
    name: voice-support-agent
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false          # set in the Render dashboard; never committed
      - key: LLM_PROVIDER
        value: auto
      - key: CORS_ORIGINS
        value: ""
